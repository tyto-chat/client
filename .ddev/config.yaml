type: generic
docroot: ""
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
omit_containers: [db]
nodejs_version: "24"
use_dns_when_possible: true
corepack_enable: false

web_environment:
  - PLAYWRIGHT_BROWSERS_PATH=/var/www/html/.playwright-cache

web_extra_exposed_ports:
  - name: playwright-report
    container_port: 9323
    http_port: 9322
    https_port: 9323

hooks:
  post-start:
    - exec: "bash -c '[ ! -d /var/www/html/node_modules ] && npm install || true'"
    # System deps are baked into the web image (web-build/Dockerfile runs
    # `playwright install-deps chromium`), so install ONLY the browser binary
    # here — no `--with-deps` apt run on every start. Guarded on the cache dir.
    - exec: "bash -c '[ -d /var/www/html/node_modules ] && [ ! -d /var/www/html/.playwright-cache ] && npx playwright install chromium || true'"
    # ddev's DNS resolves additional_hostnames (like core-test) to 127.0.0.1 inside
    # containers. Point core-test.ddev.site at ddev-router so Playwright can reach it.
    # Only needed for E2E; warn (don't fail start) if the router IP can't be found.
    - exec-host: "bash .ddev/map-core-test-host.sh"

web_extra_daemons:
  - name: vite
    command: "bash -c 'until [ -d /var/www/html/node_modules ]; do sleep 5; done; exec npm run dev'"
    directory: /var/www/html
