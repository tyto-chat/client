name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tip:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      - id: check
        env:
          REPO: ${{ github.repository }}
        run: |
          current=true
          if [ "$GITHUB_REF" = refs/heads/1.0 ]; then
            tip="$(git ls-remote "https://github.com/$REPO.git" refs/heads/1.0 | cut -f1)"
            [ "$tip" = "$GITHUB_SHA" ] || current=false
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

  image:
    needs: tip
    if: needs.tip.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/tyto-chat/tyto-client
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # prereleases (v1.0.0-beta.1) get only their exact version tag —
            # metadata-action skips the channel patterns for them, and latest is gated here
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/1.0' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
