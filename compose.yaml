name: tyto-client

services:
  web:
    image: ghcr.io/tyto-chat/tyto-client:${TYTO_VERSION:-latest}
    restart: unless-stopped
    environment:
      SERVER_DOMAIN: ${SERVER_DOMAIN:-localhost}
      BEHIND_PROXY: ${BEHIND_PROXY:-false}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
      API_DOMAIN: ${API_DOMAIN:-}
      SERVER_INFO_URL: ${SERVER_INFO_URL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
